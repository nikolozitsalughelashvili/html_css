    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ეს გუგლის ფონტების ლინკებია, რომელიც გვჭირდება რომ ვებგვერდზე გამოვიყენოთ Work Sans ფონტი -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gruppo&family=Lobster&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- ასევე მოგვაქვს Font Awesome-ის ლინკი რომ გამოვიყენოთ მათი აიკონები -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- ეს კი ჩვენი სტილის ფაილია სადაც გვაქვს ყველა CSS კოდი -->
    <link rel="stylesheet" href="style.css" />
    <title>LOGIN</title>
  </head>
  <style>
    .login {
      font-family:
        "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      margin: 5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 50%;
      height: 50vh;
      background: linear-gradient(to right, blue, PInk);
    }
    .login h1 {
      margin-bottom: 5rem;
      color: white;
    }
    .login form {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .login label {
      width: 20rem;
      color: white;
    }
    .login input {
      width: 20rem;
      height: 2rem;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    .login button {
      width: 10rem;
      height: 2rem;
      color: white;
      background-color: black;
      cursor: pointer;
      transition: 1s ease;
      margin-left: 1rem;
    }
    .login button:hover {
      background-color: purple;
    }
    #password {
      font-size: 3rem;
    }
  </style>
  <body>
    <input type="checkbox" id="burgermenu" />
    <label for="burgermenu" class="menu-label">
      <span></span>
      <span></span>
      <span></span>
    </label>
    <div class="mobile-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="myblog.html">My Blog</a>
      <a href="#contact">Contact</a>
      <a href="login.html">Login</a>
      <a href="404.html">404</a>
      <div class="mobile-nav-socials">
        <a
          href="https://www.google.com/webhp"
          class="fa-solid fa-magnifying-glass"
        ></a>
        <a href="https://www.facebook.com/" class="fa-brands fa-facebook-f"></a>
        <a href="https://www.instagram.com/" class="fa-brands fa-instagram"></a>
        <a href="https://x.com/" class="fa-brands fa-twitter"></a>
        <a
          href="https://www.pinterest.com/"
          class="fa-brands fa-pinterest-p"
        ></a>
      </div>
    </div>

    <header>
      <div class="zedalogo">EVERYTHING IS PERSONAL. INCLUDING THIS BLOG.</div>
      <div class="logo">Train of Thought</div>
      <nav class="navbar">
        <!-- id-ს დახმარებით ჩვენ შეგვიძლია ღილაკზე დაჭერისას შესაბამის ადგილას ჩამოსვლა -->
        <a href="index.html" class="selected">Home</a>
        <a href="about.html">About</a>
        <a href="myblog.html">My Blog</a>
        <a href="#contact">Contact</a>
        <a
          href="https://www.google.com/webhp"
          class="fa-solid fa-magnifying-glass"
          id="lupa"
        ></a>
        <div class="socqseli">
          <a
            href="https://www.facebook.com/"
            class="fa-brands fa-facebook-f"
          ></a>
          <a
            href="https://www.instagram.com/"
            class="fa-brands fa-instagram"
          ></a>
          <a href="https://x.com/" class="fa-brands fa-twitter"></a>
          <a
            href="https://www.pinterest.com/"
            class="fa-brands fa-pinterest-p"
          ></a>
        </div>
        <a href="login.html">Login</a>
        <a href="404.html">404</a>
      </nav>
    </header>

    <main>
      <div class="login">
        <h1>LOGIN</h1>
        <form action="index.html" method="get">
          <label for="name">NAME</label>
          <input type="text" id="name" required />
          <label for="password">PASSWORD</label>
          <input type="password" id="password" required />
          <button type="submit">LOGIN</button>
        </form>
      </div>
    </main>
    <footer id="contact">
      <section class="contact">
        <div class="isari">
          <svg
            preserveAspectRatio="none"
            data-bbox="72.5 20 55 160"
            viewBox="72.5 20 55 160"
            height="200"
            width="200"
            xmlns="http://www.w3.org/2000/svg"
            data-type="shape"
            role="img"
            aria-label="Back to top"
            wixshapeid="9a75abcd83524a1a9b048847ed30cd3b.svg"
          >
            <g>
              <path
                d="M127.5 49.186L100 20 72.5 49.186l2.957 2.808 22.116-23.476V180h4.854V28.518l22.116 23.476 2.957-2.808z"
              ></path>
            </g>
          </svg>
        </div>
        <h1>Drop Me a Line, Let Me Know What You Think</h1>

        <!-- ეს ფორმის დასაწყისია, სადაც არის სხვადასხვა ველები სახელის, ელფოსტის და მესიჯის შესასვლელად -->

        <form action="">
          <div class="names">
            <div class="form-group">
              <!-- ეს სახელის ველია, სადაც შეგვიძლია ჩავწეროთ სახელი -->
              <label for="fname">First Name *</label>

              <input
                class="fname"
                type="text"
                id="fname"
                name="fname"
                required
              />
              <!-- ეს required ნიშნავს რომ ველი სავალდებულოა და არ იმუშავებს ფორმა თუ ეს ველი ცარიელია -->
            </div>
            <div class="form-group">
              <!-- ეს გვარის ველია, სადაც შეგვიძლია ჩავწეროთ გვარი -->
              <label for="lname">Last Name *</label>

              <input
                class="lname"
                type="text"
                id="lname"
                name="lname"
                required
              />
            </div>
          </div>

          <!-- ეს იმეილის ველია, სადაც შეგვიძლია ჩავწეროთ იმეილი -->
          <div class="form-group">
            <label for="emailId">Email *</label>
            <input
              class="emailinput"
              type="email"
              id="emailId"
              name="email"
              required
            />
          </div>

          <div class="message form-group">
            <!-- ეს მესიჯის ველია, სადაც შეგვიძლია ჩავწეროთ მესიჯი, სპეციალური თეგი გამოვიყენეთ დიდი ადგილისთვის -->
            <label for="message">message...</label>

            <textarea
              class="messageinput"
              id="message"
              name="message"
              rows="5"
              required
            ></textarea>
          </div>
          <!-- ეს კი ფორმის გასაშვები ღილაკია -->
          <button class="submit" type="submit">Submit</button>
        </form>
      </section>

      <!-- ეს კი ბოლოსართის ბოლო ნაწილი სადაც არის კოპირაითი -->
      <section class="copyright">
        <p>
          © 2035 by Train of Thoughts. Powered and secured by <span>Wix</span>
        </p>
      </section>
    </footer>
  </body>
